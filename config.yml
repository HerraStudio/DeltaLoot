# DeltaLoot — Paper 1.21.11 / Java 21
# 修改后使用 /deltaloot reload。配置无效时会拒绝加载并给出具体字段。
# 每个实体箱独立生成战利品；同一箱子的搜索结果和取走状态由玩家共享。
gui:
  # 2..6 行；所有格子均可搜索，可搜索格数 = rows * 9，没有底部操作栏。
  rows: 4

search:
  # 玩家与箱子之间允许的最大距离（1..16 格）。
  max-distance: 5.0
  # 受到实际伤害时打断当前格；1 秒未再受伤后自动从本格重新搜索。
  cancel-on-damage: true

# 表 ID 和条目 ID 只允许小写字母、数字、下划线与短横线。
# min/max-rolls：本轮随机抽取次数（含首尾），最大值不能超过可搜索格数。
# empty-chance：每次抽取落空的概率（0..1），未参与抽取的格子同样为空。
# 非空结果按 weight 相对权重有放回抽取，所以相同物品可能出现在多个格子。
# 结果会打乱位置；打开界面后从左到右、从上到下自动逐格搜索，无需点击。
# 可边搜索边点击领取已揭示物品；关闭界面停止搜索，重开跳过已揭示格。
# refresh-seconds：刷新间隔，1..604800 秒。
# search-seconds：单件物品的搜索时间，0.1..3600 秒，四舍五入至服务器刻。
# 数量不得超过该物品的原版堆叠上限。名称/描述为纯文本，不解析 MiniMessage。
# 六档示例：普通(白)、精良(绿)、稀有(蓝)、史诗(紫)、传说(金)、绝密(红)。
# rarity-color 使用 Adventure NamedTextColor，如 white/green/blue/light_purple/gold/red。
# 自定义物品名称仅提供外观，不额外添加枪械、治疗或交易功能。
